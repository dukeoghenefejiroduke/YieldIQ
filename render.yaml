services:
  - type: web
    name: agrovoice-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: FRONTEND_URL
        value: https://yieldiq.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
  - type: static
    name: agrovoice
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: https://yieldiq2.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
